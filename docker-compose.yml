services:
  db:
    image: postgres:15-alpine
    container_name: walkscale-db
    environment:
      POSTGRES_USER: walkuser
      POSTGRES_PASSWORD: walkpassword
      POSTGRES_DB: walkscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: walkscale-backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: walkscale-frontend
    ports:
      # Exposes on 5174 to match your current Vite setup
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: